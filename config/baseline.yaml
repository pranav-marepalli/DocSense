# Phase 2 baseline retrieval config: dense embedding + exact search over
# data/parsed/chunks.jsonl. See docs/design/phase-2.md for the contract. Every
# ablation variant (Phase 4/7) is a copy of this file with fields changed, never
# a code change. No generation.* block exists yet (decision 1).

variant_name: "baseline"
seed: 0

chunks_path: "data/parsed/chunks.jsonl"
index_dir: "data/index/baseline"
record_format: "jsonl"

embedder:
  type: "sentence_transformer"
  model_name: "BAAI/bge-small-en-v1.5"
  dim: 384
  normalize: true
  batch_size: 32
  device: null
  max_seq_length: 512
  query_prefix: "Represent this sentence for searching relevant passages: "
  passage_prefix: ""
  trust_remote_code: false

index:
  type: "faiss_flat_ip"
  # faiss's OpenMP-parallel multi-query search() deterministically crashes on
  # machines where torch has already imported its own bundled OpenMP runtime
  # (a macOS duplicate-libomp clash). Pinning to 1 thread avoids it; raise
  # this if you know your environment doesn't hit the conflict, for more
  # search parallelism.
  num_threads: 1

retrieval:
  top_k: 5
  max_chunks_per_paper: null
