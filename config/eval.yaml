# Phase 3 eval harness config: one eval config across all variants.
# retriever_config names the variant config file to load, so a Phase 7
# ablation variant stays a single retrieval config copy instead of also
# duplicating the embedder block here. See docs/design/phase-3.md §4.

retriever_config: "baseline"
seed: 0

eval:
  gold_path: "data/eval/gold_set.jsonl"
  runs_dir: "data/eval/runs"
  record_format: "jsonl"
  k_values: [1, 3, 5, 10]
  primary_k: 5
  retrieval_top_k: 10
  binary_relevance_threshold: 1
  per_query_detail: true
  slice_by: ["query_type", "difficulty"]
  min_queries_warn: 30

labeling:
  queries_path: "data/eval/queries.txt"
  pool_k: 20
  snippet_chars: 400
